[package]
name = "parquet-merge"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "parquet-merge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
parquet = { version = "59.2.0", features = ["arrow"] }

[dev-dependencies]
arrow-array = "60.0.0"
arrow-schema = "59.2.0"
